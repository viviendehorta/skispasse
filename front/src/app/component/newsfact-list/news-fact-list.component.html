<div class="newsfact-list-panel" [ngClass]="{'sk-collapsed': isCollapsed }">

    <ul *ngIf="newsFacts" >
        <li *ngFor="let newsFact of newsFacts">
            {{newsFact.title}}
        </li>
    </ul>

    <!--collapse button-->
    <button *ngIf="newsFacts" pButton type="button" [icon]="!newsFacts.length ? 'pi pi-chevron-left': 'pi pi-chevron-right'"
            class="collapse-button"
            (click)="collapse()"></button>
</div>
